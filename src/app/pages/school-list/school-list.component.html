<div class="container mt-3">
    <div class="row">
        <div class="text-center my-3" *ngIf="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div *ngIf="!loading">
            <div *ngIf="errorMessage" class="bg-danger text-white text-center rounded">
                <div class="row">
                    <p class="mt-3">
                        {{errorMessage}}
                    </p>
                </div>
            </div>
            <div class="col-md-6 mb-3" *ngFor="let school of schools">
                <div class="card h-100 shadow-lg">
                    <div class="card-body">
                        <h5 class="card-title">{{school.schoolName}}</h5>
                        <p class="card-text">
                            <strong>Address:</strong><br />
                            {{ school.schoolAddress }}
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
