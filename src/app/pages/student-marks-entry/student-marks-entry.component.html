<div class="container-fluid">
    <div class="row bg-primary rounded my-3 py-1">
        <h3 class="text-white">Enter Marks</h3>
      </div>
</div>

<form (ngSubmit)="submitMarks()">
    <table class="table table-bordered table-striped w-100">
      <thead>
        <tr>
          <th style="width: 70%;">Student Name</th>
          <th style="width: 30%;">Marks Obtained</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let entry of markList">
          <td>{{ entry.studentName }}</td>
          <td>
            <input
              type="number"
              [(ngModel)]="entry.marksObtained"
              name="marks-{{entry.studentId}}"
              class="form-control"
              required
            />
          </td>
        </tr>
      </tbody>
    </table>
  
    <button type="submit" class="btn btn-warning my-3">Submit All Marks</button>
  </form>
